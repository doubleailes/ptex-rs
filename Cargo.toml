[package]
name = "ptex-rust"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Pure-Rust reader for Disney's Ptex per-face texture file format"
license = "MIT"
repository = "https://github.com/doubleailes/ptex-rs"
keywords = ["ptex", "texture", "graphics", "vfx"]
categories = ["graphics", "parser-implementations", "rendering::data-formats"]

[lib]
name = "ptex"

[features]
default = ["cache"]
# Thread-safe `SharedReader` with a byte-budgeted cache of decoded pixels.
cache = ["dep:lru"]

[dependencies]
flate2 = "1"
# >= 0.18.2 for RUSTSEC-2026-0002 and RUSTSEC-2026-0253; it sets the crate's
# 1.85 MSRV. With default features off it drops hashbrown and uses std's
# HashMap, so this adds no transitive dependencies.
lru = { version = "0.18.2", default-features = false, optional = true }

[dev-dependencies]
# Already a normal dependency; used by tests that hand-build .ptx files.
flate2 = "1"
